name: Build APK v48

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Clean build cache
        run: flutter clean

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          APK_VERSION="v48"
          APK_FILE="moincar-${APK_VERSION}.apk"
          PREV_VERSION="v47"
          PREV_APK="moincar-${PREV_VERSION}.apk"
          BUILD_DATE=$(date +"%Y-%m-%d")
          COMMIT_MSG="${APK_VERSION} APK 배포 (홈3축카드 정밀검색 채팅우선contactStage 전화허용)"

          git clone https://$GH_TOKEN@github.com/popul076/popul076.github.io.git pages_repo
          cp build/app/outputs/flutter-apk/app-release.apk pages_repo/${APK_FILE}
          cd pages_repo
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          python3 - << PYEOF
import os
v = os.environ.get("APK_VERSION", "v48") if False else "${APK_VERSION}"
f = "${APK_FILE}"
pv = "${PREV_VERSION}"
pf = "${PREV_APK}"
bd = "${BUILD_DATE}"
html = """<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모인카 앱 다운로드</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0d1b2a; color: #fff; font-family: sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: #1a2d42; border-radius: 20px; padding: 40px 30px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
.badge { background: #10b981; color: #fff; border-radius: 20px; padding: 4px 16px; font-size: 13px; font-weight: 700; display: inline-block; margin-bottom: 20px; }
.phone-icon { font-size: 60px; margin-bottom: 16px; }
h1 { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
.meta { color: #8fa8c0; font-size: 13px; margin-bottom: 28px; line-height: 1.8; }
.btn-primary { display: block; background: linear-gradient(135deg,#1565c0,#4fc3f7); color: #fff; text-decoration: none; border-radius: 14px; padding: 18px; font-size: 18px; font-weight: 800; margin-bottom: 12px; }
.btn-primary:active { opacity: 0.85; }
.btn-secondary { display: block; background: #253548; color: #8fa8c0; text-decoration: none; border-radius: 12px; padding: 14px; font-size: 14px; margin-bottom: 8px; }
.direct-link { margin-top: 14px; padding: 12px; background: #0d1b2a; border-radius: 10px; border: 1px solid #1e3a5f; }
.direct-link p { font-size: 11px; color: #8fa8c0; margin-bottom: 6px; }
.direct-link a { color: #4fc3f7; font-size: 12px; word-break: break-all; }
.install-guide { margin-top: 16px; background: #1a2d42; border: 1px solid #ff6b35; border-radius: 10px; padding: 14px; text-align: left; }
.install-guide h4 { font-size: 13px; color: #ff6b35; margin-bottom: 8px; }
.install-guide p { font-size: 12px; color: #cdd8e3; line-height: 1.8; }
</style>
</head>
<body>
<div class="card">
  <div class="badge">""" + v + """ 최신버전</div>
  <div class="phone-icon">&#128241;</div>
  <h1>moincar """ + v + """</h1>
  <div class="meta">버전 """ + v + """ &middot; 약 27MB<br>""" + bd + """ 배포</div>
  <a href="./""" + f + """" download=\"""" + f + """\" class="btn-primary">&#11015; APK 다운로드 (""" + v + """)</a>
  <a href="./""" + pf + """" download=\"""" + pf + """\" class="btn-secondary">이전 버전 (""" + pv + """) 다운로드</a>
  <div class="direct-link">
    <p>&#9888; 버튼이 작동 안 할 경우 아래 링크를 길게 눌러 저장하세요</p>
    <a href="https://popul076.github.io/""" + f + """">https://popul076.github.io/""" + f + """</a>
  </div>
  <div class="install-guide">
    <h4>&#128204; 안드로이드 설치 방법</h4>
    <p>1. APK 다운로드 후 파일 앱에서 실행<br>2. 알 수 없는 앱 설치 허용<br>3. 설치 완료 후 moincar 실행</p>
  </div>
</div>
</body>
</html>"""
with open("index.html", "w", encoding="utf-8") as fp:
    fp.write(html)
print("index.html generated OK")
PYEOF

          git add ${APK_FILE} index.html
          git commit -m "${COMMIT_MSG}"
          git push

name: Build APK v58

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Build APK
        run: |
          flutter pub get
          flutter clean
          flutter build apk --release --no-tree-shake-icons

      - name: Deploy APK to GitHub Pages
        env:
          PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
        run: |
          APK_VERSION="v58"
          APK_FILE="moincar-${APK_VERSION}.apk"
          PREV_VERSION="v57"
          PREV_APK="moincar-${PREV_VERSION}.apk"
          BUILD_DATE=$(date '+%Y-%m-%d %H:%M')
          COMMIT_MSG="${APK_VERSION} APK 배포 (내매물 빈화면 근본수정 - 3단계 폴백 로직)"

          git clone https://x-access-token:${PAGES_TOKEN}@github.com/popul076/popul076.github.io.git pages_repo
          cp build/app/outputs/flutter-apk/app-release.apk pages_repo/${APK_FILE}
          cd pages_repo
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          python3 ./../scripts/gen_html.py "${APK_VERSION}" "${APK_FILE}" "${PREV_VERSION}" "${PREV_APK}" "${BUILD_DATE}"
          git add ${APK_FILE} index.html
          git commit -m "${COMMIT_MSG}"
          git push

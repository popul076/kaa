name: Build Flutter APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (arm64)
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.incremental=false -Dorg.gradle.jvmargs=-Xmx4g"
          JAVA_TOOL_OPTIONS: "-Xmx4g"
        run: |
          flutter build apk --release \
            --target-platform android-arm64
          VERSION=$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}' | tr -d '\r')
          BUILD=$(echo $VERSION | cut -d'+' -f2)
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/moincar-v${BUILD}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: moincar-v32
          path: build/app/outputs/flutter-apk/moincar-v*.apk
          retention-days: 30

      - name: Show APK info
        run: |
          ls -lh build/app/outputs/flutter-apk/
          echo "✅ APK 빌드 성공!"

name: Build APK v35

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Cache Gradle + NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
            /usr/local/lib/android/sdk/ndk
          key: ${{ runner.os }}-gradle-ndk-${{ hashFiles('**/*.gradle*', '**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ndk-
            ${{ runner.os }}-gradle-

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git clone https://$GH_TOKEN@github.com/popul076/popul076.github.io.git pages_repo
          cp build/app/outputs/flutter-apk/app-release.apk pages_repo/moincar-v35.apk
          cd pages_repo
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add moincar-v35.apk
          git commit -m "APK 배포"
          git push

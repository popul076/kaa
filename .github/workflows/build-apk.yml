name: Build APK v56

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Clean build cache
        run: flutter clean

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          APK_VERSION="v56"
          APK_FILE="moincar-${APK_VERSION}.apk"
          PREV_VERSION="v55"
          PREV_APK="moincar-${PREV_VERSION}.apk"
          BUILD_DATE=$(date +"%Y-%m-%d")
          COMMIT_MSG="${APK_VERSION} APK 배포 (내매물 회색빈화면 완전수정 Column+ListView교체)"

          git clone https://$GH_TOKEN@github.com/popul076/popul076.github.io.git pages_repo
          cp build/app/outputs/flutter-apk/app-release.apk pages_repo/${APK_FILE}
          cd pages_repo
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          python3 ./../scripts/gen_html.py "${APK_VERSION}" "${APK_FILE}" "${PREV_VERSION}" "${PREV_APK}" "${BUILD_DATE}"

          git add ${APK_FILE} index.html
          git commit -m "${COMMIT_MSG}"
          git push
